<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
:root{
  --bg:#F7F5F2; --card:#FFFFFF; --header:#2E3A46; --text:#23282D; --muted:#6B7280;
  --line:#E7E3DB; --accent:#4C72B0; --ok:#2F9E58; --warn:#D98E04; --danger:#D64545; --neutral:#9AA0A6;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
.wrap{max-width:1000px;margin:0 auto;padding:16px;}
header{background:var(--header);color:#fff;padding:18px 22px;border-radius:var(--radius);margin-bottom:16px;}
header h1{font-size:19px;font-weight:700;}
header p{font-size:12.5px;opacity:.8;margin-top:4px;}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.who{font-size:12.5px;color:var(--muted);}
.who b{color:var(--text);}
.btn{background:var(--header);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn.sec{background:#EEECE7;color:var(--text);}
.btn.link{background:none;color:var(--danger);padding:9px 4px;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.06);}
table{width:100%;border-collapse:collapse;background:var(--card);}
th,td{padding:10px 12px;text-align:right;font-size:13px;border-bottom:1px solid #f0eee9;white-space:nowrap;}
th{background:#FAFAF8;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#FAF9F6;}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;color:#fff;}
.s-todo{background:var(--neutral);} .s-prog{background:var(--warn);} .s-wait{background:#B08D57;} .s-done{background:var(--ok);}
.muted{color:var(--muted);}
.state{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
.err{background:#FDECEC;color:#8A2B2B;border:1px solid #F3C7C7;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:12px;white-space:pre-wrap;}
.overlay{position:fixed;inset:0;background:rgba(35,40,45,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.overlay[hidden]{display:none;}
.modal{background:var(--card);border-radius:var(--radius);max-width:560px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.2);}
.modal h2{font-size:16px;font-weight:700;padding:18px 20px;border-bottom:1px solid #f0eee9;}
.modal-body{padding:18px 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.f label{font-size:11.5px;font-weight:600;color:var(--muted);}
.f input,.f select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--text);width:100%;}
.actions{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:4px;border-top:1px solid #f0eee9;}
.actions .right{display:flex;gap:8px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--header);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:60;}
.toast[hidden]{display:none;}
.busy{opacity:.5;pointer-events:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 Family OS — Tasks</h1>
    <p>פרוסה אנכית: קריאה וכתיבה אמיתית לטאב Tasks בגיליון Family_OS_Database</p>
  </header>

  <div id="err" class="err" hidden></div>

  <div class="bar">
    <span class="who">מחובר כ: <b id="who">…</b></span>
    <button class="btn" id="addBtn" disabled>+ משימה חדשה</button>
  </div>

  <div id="content"><div class="state">טוען משימות…</div></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">משימה</h2>
    <div class="modal-body">
      <form id="form">
        <div class="f">
          <label for="TaskName">שם המשימה</label>
          <input type="text" id="TaskName" required>
        </div>
        <div class="grid">
          <div class="f"><label for="Category">תחום</label><select id="Category"></select></div>
          <div class="f"><label for="Assignee">אחראי</label><select id="Assignee"></select></div>
          <div class="f"><label for="Status">סטטוס</label><select id="Status"></select></div>
          <div class="f"><label for="TaskType">סוג</label><select id="TaskType"></select></div>
          <div class="f"><label for="Priority">עדיפות</label><select id="Priority"></select></div>
          <div class="f"><label for="Frequency">תדירות</label><select id="Frequency"></select></div>
          <div class="f"><label for="DueDate">תאריך יעד</label><input type="date" id="DueDate"></div>
          <div class="f"><label for="DueTime">שעה</label><input type="time" id="DueTime"></div>
        </div>
        <div class="f">
          <label for="NextStep">השלב הבא</label>
          <input type="text" id="NextStep">
        </div>
        <div class="actions">
          <div></div>
          <div class="right">
            <button type="button" class="btn sec" id="cancelBtn">ביטול</button>
            <button type="submit" class="btn" id="saveBtn">שמירה</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
var OPTIONS = {
  Category: ['פיננסים וניהול עתידי','ילדים','קניות וציוד','תחזוקת הבית','פרויקטים וחלומות','לוח שנה ואירועים'],
  Assignee: ['לירן','מורן'],
  Status: ['טרם התחיל','בביצוע','ממתין','הושלם'],
  TaskType: ['חד-פעמית','תהליכית'],
  Priority: ['דחוף','רגיל','נמוך'],
  Frequency: ['חד-פעמי','יומי','שבועי','חודשי']
};
var STATUS_CLASS = {'טרם התחיל':'s-todo','בביצוע':'s-prog','ממתין':'s-wait','הושלם':'s-done'};
var state = { rows: [], editingId: null };

function $(id){ return document.getElementById(id); }

function showErr(msg){ var e=$('err'); e.textContent='שגיאה: '+msg; e.hidden=false; }
function clearErr(){ $('err').hidden=true; }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2200); }

function fillSelect(id){
  var sel=$(id); sel.innerHTML='';
  OPTIONS[id].forEach(function(v){
    var o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
  });
}
Object.keys(OPTIONS).forEach(fillSelect);

function load(){
  clearErr();
  google.script.run
    .withSuccessHandler(function(lists){
      ['Category','Assignee'].forEach(function(k){
        if(lists && lists[k] && lists[k].length){ OPTIONS[k]=lists[k]; fillSelect(k); }
      });
    })
    .withFailureHandler(function(){ /* לא קריטי — נשארים עם הרשימות המקודדות */ })
    .getLists();
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(function(e){ showErr(e.message); $('content').innerHTML='<div class="state">לא ניתן לטעון.</div>'; })
    .getTasks();
}

function onData(data){
  state.rows = data.rows || [];
  $('who').textContent = data.user || '(לא זוהה)';
  $('addBtn').disabled = false;
  render();
}

function render(){
  if(!state.rows.length){ $('content').innerHTML='<div class="state">אין משימות עדיין. לחץ "+ משימה חדשה".</div>'; return; }
  var html='<div class="table-wrap"><table><thead><tr>'+
    '<th>משימה</th><th>תחום</th><th>אחראי</th><th>תאריך</th><th>סטטוס</th><th>סוג</th></tr></thead><tbody>';
  state.rows.forEach(function(t){
    var date=[t.DueDate,t.DueTime].filter(Boolean).join(' · ')||'—';
    var cls=STATUS_CLASS[t.Status]||'s-todo';
    html+='<tr data-id="'+t.TaskID+'">'+
      '<td>'+esc(t.TaskName)+'</td>'+
      '<td class="muted">'+esc(t.Category)+'</td>'+
      '<td>'+esc(t.Assignee)+'</td>'+
      '<td class="muted">'+esc(date)+'</td>'+
      '<td><span class="pill '+cls+'">'+esc(t.Status||'—')+'</span></td>'+
      '<td class="muted">'+esc(t.TaskType||'—')+'</td></tr>';
  });
  html+='</tbody></table></div>';
  $('content').innerHTML=html;
  document.querySelectorAll('tbody tr').forEach(function(tr){
    tr.addEventListener('click',function(){ openForm(tr.dataset.id); });
  });
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function openForm(id){
  state.editingId = id || null;
  var t = id ? state.rows.filter(function(r){return String(r.TaskID)===String(id);})[0] : {};
  $('modalTitle').textContent = id ? ('עריכה — '+ (t.TaskName||'')) : 'משימה חדשה';
  $('TaskName').value = t.TaskName || '';
  $('NextStep').value = (t.NextStep && t.NextStep!=='—') ? t.NextStep : '';
  ['Category','Assignee','Status','TaskType','Priority','Frequency'].forEach(function(k){
    $(k).value = t[k] || OPTIONS[k][0];
  });
  $('DueDate').value = /^\d{4}-\d{2}-\d{2}$/.test(t.DueDate||'') ? t.DueDate : '';
  $('DueTime').value = /^\d{2}:\d{2}$/.test(t.DueTime||'') ? t.DueTime : '';
  $('overlay').hidden = false;
}
function closeForm(){ $('overlay').hidden = true; }

$('addBtn').addEventListener('click',function(){ openForm(null); });
$('cancelBtn').addEventListener('click', closeForm);
$('overlay').addEventListener('click',function(e){ if(e.target===$('overlay')) closeForm(); });

$('form').addEventListener('submit',function(e){
  e.preventDefault();
  var payload = {
    TaskName: $('TaskName').value.trim(),
    Category: $('Category').value,
    Assignee: $('Assignee').value,
    Status: $('Status').value,
    TaskType: $('TaskType').value,
    Priority: $('Priority').value,
    Frequency: $('Frequency').value,
    DueDate: $('DueDate').value || '',
    DueTime: $('DueTime').value || '',
    NextStep: $('NextStep').value.trim() || ''
  };
  if(!payload.TaskName) return;
  document.querySelector('.modal').classList.add('busy');
  clearErr();
  var done = function(data){
    document.querySelector('.modal').classList.remove('busy');
    closeForm();
    onData(data);
    if(data.warnings && data.warnings.length){
      showErr('חלק מהעדכון לא נשמר:\n• ' + data.warnings.join('\n• '));
      toast('נשמר חלקית');
    } else {
      toast(state.editingId ? 'העדכון נשמר בגיליון' : 'המשימה נוספה לגיליון');
    }
    state.editingId = null;
  };
  var fail = function(err){
    document.querySelector('.modal').classList.remove('busy');
    showErr(err.message);
  };
  if(state.editingId){
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).updateTask(state.editingId, payload);
  } else {
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).addTask(payload);
  }
});

load();
</script>
</body>
</html>
