<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E3A46">
<title>Family OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🏠 Family OS</h1>
      <div class="sub" id="storageLine">טוען…</div>
    </div>
    <div class="header-actions">
      <button class="hbtn" id="installBtn" hidden>📲 התקן אפליקציה</button>
      <button class="hbtn" id="resetBtn">♻️ אפס הכל</button>
    </div>
  </header>

  <div class="notice" id="notifNotice" hidden>
    <span>🔔 כדי לקבל תזכורות מקומיות על משימות עם תאריך יעד — צריך לאשר התראות.</span>
    <button id="enableNotifBtn">אפשר התראות</button>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="finance-card" id="financeCard" hidden></div>

  <div class="tabs">
    <div class="tab active" data-tab="projects" tabindex="0">🧩 פרויקטים</div>
    <div class="tab" data-tab="tasks" tabindex="0">✅ משימות</div>
    <div class="tab" data-tab="routines" tabindex="0">🔁 שגרות יומיות</div>
    <div class="tab" data-tab="shopping" tabindex="0">🛒 קניות</div>
    <div class="tab" data-tab="people" tabindex="0">👪 בני המשפחה</div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="section active" id="sec-projects">
    <div class="cards" id="projectsCards"></div>
  </div>
  <div class="section" id="sec-tasks">
    <div class="toolbar-row"><button class="btn-primary" id="addTaskBtn">+ משימה חדשה</button></div>
    <div class="table-wrap"><table id="tasksTable"></table></div>
  </div>
  <div class="section" id="sec-routines">
    <div class="toolbar-row"><button class="btn-primary" id="addRoutineBtn">+ שגרה חדשה</button></div>
    <div class="routines-grid" id="routinesGrid"></div>
  </div>
  <div class="section" id="sec-shopping">
    <div class="toolbar-row"><button class="btn-primary" id="addShopBtn">+ פריט קניות</button></div>
    <div class="table-wrap"><table id="shopTable"></table></div>
  </div>
  <div class="section" id="sec-people"><div class="people-grid" id="peopleGrid"></div></div>

  <p class="footer-note">Family OS · שלב 1 (Prototype PWA מקומי) · מתפתח מ-family_hub_dashboard.html</p>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
